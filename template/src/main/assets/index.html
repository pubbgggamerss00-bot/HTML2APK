<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>اپلیکیشن شما آماده است</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0A1411; color: #E7F4EC;
    font-family: "Vazirmatn", Tahoma, sans-serif;
  }
  .card {
    text-align: center; padding: 40px 28px;
    background: #0F1F19; border: 1px solid #2A4A3C; border-radius: 20px;
    max-width: 420px; margin: 16px;
  }
  .glyph {
    width: 72px; height: 72px; margin: 0 auto 20px;
    border-radius: 18px; background: #163026;
    display: flex; align-items: center; justify-content: center;
    color: #6EE7A8; font-size: 26px; font-weight: bold;
    font-family: "JetBrains Mono", monospace;
    border: 1px solid #2EBD85;
  }
  h1 { font-size: 20px; margin-bottom: 10px; color: #34D399; }
  p  { font-size: 14px; line-height: 1.9; color: #93B2A3; }
  code {
    direction: ltr; display: inline-block;
    background: #050C09; padding: 2px 8px; border-radius: 6px;
    font-family: monospace; font-size: 12px; color: #6EE7A8;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="glyph">&lt;/&gt;</div>
    <h1>اپلیکیشن شما آماده است 🎉</h1>
    <p>
      این صفحهٔ پیش‌فرض قالب است. فایل <code>index.html</code> و بقیهٔ فایل‌های
      پروژهٔ شما داخل پوشهٔ <code>assets</code> قرار گرفته‌اند؛ کافی است محتوای خود را
      این‌جا بگذارید.
    </p>
  </div>
</body>
</html>
