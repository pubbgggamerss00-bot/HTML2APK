name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper (pinned to 8.7)
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin --no-daemon

      - name: Build template APK
        run: ./gradlew :template:assembleRelease --no-daemon --stacktrace

      - name: Verify template icon entry paths (must not be shortened)
        run: |
          if unzip -l template/build/outputs/apk/release/template-release-unsigned.apk | grep -E "res/mipmap-(mdpi|hdpi|xhdpi|xxhdpi|xxxhdpi)(-v[0-9]+)?/ic_launcher.png" >/dev/null; then
            echo "template icon entries intact"
          else
            echo "::error::template mipmap paths were shortened (resource optimizations active)"; exit 1
          fi

      - name: Extract binary fixtures & embed template APK
        run: |
          mkdir -p app/src/main/assets app/src/test/resources
          unzip -o template/build/outputs/apk/release/template-release-unsigned.apk AndroidManifest.xml resources.arsc -d /tmp/tmplfix
          cp /tmp/tmplfix/AndroidManifest.xml app/src/test/resources/real_template_manifest.bin
          cp /tmp/tmplfix/resources.arsc app/src/test/resources/real_resources_arsc.bin
          cp template/build/outputs/apk/release/template-release-unsigned.apk app/src/main/assets/template.apk
          # fixture for the JVM end-to-end engine test (EngineEndToEndTest)
          cp template/build/outputs/apk/release/template-release-unsigned.apk app/src/test/resources/real_template.apk

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build app APK (debug)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HTML2APK-debug.apk

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HTML2APK-debug-apk
          path: HTML2APK-debug.apk
          retention-days: 90
